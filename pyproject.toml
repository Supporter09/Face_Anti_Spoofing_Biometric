[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-anti-spoofing-biometric"
version = "0.1.0"
description = "Face liveness MVP and research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
  "opencv-python>=4.9",
  "pillow>=10.0",
  "insightface>=0.7",
  "onnxruntime-gpu>=1.18",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "mediapipe==0.10.35",
  "rembg==2.0.75"
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
